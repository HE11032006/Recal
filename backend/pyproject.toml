[project]
name = "recal-backend"
version = "0.1.0"
description = "Backend agentique de Recal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "boto3>=1.35,<2.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "sentry-sdk[fastapi]>=2.19,<3.0",
]

[project.optional-dependencies]
agent = [
  "strands-agents>=1.0",
]
search = [
  "tavily-python>=0.5",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recal"]
