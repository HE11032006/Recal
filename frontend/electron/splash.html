<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 480px;
        height: 320px;
        background: #111317 url("splash-bg.png") center / cover no-repeat;
        border: 1px solid #444655;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        padding-bottom: 24px;
        font-family: "JetBrains Mono", "Consolas", monospace;
        overflow: hidden;
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(17, 19, 23, 0.88) 0%,
          rgba(17, 19, 23, 0.25) 55%,
          rgba(17, 19, 23, 0.45) 100%
        );
        pointer-events: none;
      }
      body > * {
        position: relative;
        z-index: 1;
      }
      .logo {
        width: 72px;
        height: 72px;
        border: 1px solid #7287ff;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 600;
        color: #bac3ff;
        background: rgba(114, 135, 255, 0.08);
        position: relative;
      }
      .logo::after {
        content: "";
        position: absolute;
        inset: -8px;
        border: 1px solid rgba(114, 135, 255, 0.25);
        border-radius: 10px;
        animation: pulse 2s ease-out infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.15);
          opacity: 0;
        }
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(226, 226, 230, 0.15);
        border-top-color: #bac3ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .title {
        font-size: 15px;
        letter-spacing: 0.35em;
        color: #e2e2e6;
        text-transform: uppercase;
      }
      .status {
        font-size: 10px;
        letter-spacing: 0.2em;
        color: #8e8fa1;
        text-transform: uppercase;
        animation: blink 1.2s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      .bar {
        width: 200px;
        height: 2px;
        background: #1e2023;
        overflow: hidden;
        border-radius: 1px;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #bac3ff;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div class="status">Initialisation de l'agent</div>
  </body>
</html>
