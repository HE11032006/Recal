AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Recal — agent de veille d'opportunités.
  Worker Lambda réveillé par EventBridge Scheduler, persistance DynamoDB,
  analyse Claude Haiku 4.5 via Bedrock, recherche Parallel Search MCP.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  WatchScheduleExpression:
    Type: String
    Default: rate(1 hour)
    Description: Expression EventBridge Scheduler du cycle de veille.
  ApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Clé API partagée exigée par l'API publique (header x-api-key).
      Vide = pas de protection. Génère avec : python -c "import secrets; print(secrets.token_hex(32))".

Resources:
  OpportunitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "recal-opportunities-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "recal-profiles-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "recal-runs-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  WatchStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "recal-watch-state-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "recal-worker-${Environment}"
      CodeUri: ../backend/src
      Handler: recal.infrastructure.worker.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      Timeout: 600
      MemorySize: 512
      Environment:
        Variables:
          APP_ENV: !Ref Environment
          PERSISTENCE_PROVIDER: dynamodb
          SEARCH_PROVIDER: parallel
          PARALLEL_SEARCH_ENDPOINT: https://search.parallel.ai/mcp
          ANALYZER_PROVIDER: strands
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DYNAMODB_TABLE_OPPORTUNITIES: !Ref OpportunitiesTable
          DYNAMODB_TABLE_PROFILES: !Ref ProfilesTable
          DYNAMODB_TABLE_RUNS: !Ref RunsTable
          DYNAMODB_TABLE_WATCH_STATE: !Ref WatchStateTable
          AGENT_MAX_TOOL_CALLS: "3"
          AGENT_TIMEOUT_SECONDS: "300"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OpportunitiesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WatchStateTable
        - Statement:
            - Sid: BedrockInvokeTargetModelOnly
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*::foundation-model/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
      Events:
        WatchSchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub "recal-watch-${Environment}"
            ScheduleExpression: !Ref WatchScheduleExpression
            FlexibleTimeWindow:
              Mode: FLEXIBLE
              MaximumWindowInMinutes: 5
            RetryPolicy:
              MaximumRetryAttempts: 1
            DeadLetterConfig:
              Arn: !GetAtt WorkerDeadLetterQueue.Arn

  WorkerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "recal-worker-dlq-${Environment}"
      MessageRetentionPeriod: 1209600

  WorkerDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WorkerDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeSchedulerToSendToDLQ
            Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt WorkerDeadLetterQueue.Arn

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "recal-api-${Environment}"
      CodeUri: ../backend/src
      Handler: recal.main.handler
      Runtime: python3.12
      Architectures: [x86_64]
      Timeout: 600
      MemorySize: 512
      Environment:
        Variables:
          APP_ENV: !Ref Environment
          PERSISTENCE_PROVIDER: dynamodb
          SEARCH_PROVIDER: parallel
          PARALLEL_SEARCH_ENDPOINT: https://search.parallel.ai/mcp
          ANALYZER_PROVIDER: strands
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DYNAMODB_TABLE_OPPORTUNITIES: !Ref OpportunitiesTable
          DYNAMODB_TABLE_PROFILES: !Ref ProfilesTable
          DYNAMODB_TABLE_RUNS: !Ref RunsTable
          DYNAMODB_TABLE_WATCH_STATE: !Ref WatchStateTable
          AGENT_MAX_TOOL_CALLS: "3"
          AGENT_TIMEOUT_SECONDS: "300"
          API_KEY: !Ref ApiKey
          CORS_ALLOW_ALL: "true"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OpportunitiesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WatchStateTable
        - Statement:
            - Sid: BedrockInvokeTargetModelOnly
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*::foundation-model/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  WorkerFunctionArn:
    Description: ARN du worker Lambda
    Value: !GetAtt WorkerFunction.Arn
  ApiFunctionUrl:
    Description: URL publique de l'API (protégée par x-api-key si configurée)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  WorkerDeadLetterQueueUrl:
    Description: URL de la DLQ des cycles en échec
    Value: !Ref WorkerDeadLetterQueue
