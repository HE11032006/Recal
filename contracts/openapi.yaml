openapi: 3.0.3
info:
  title: Recal API
  version: 0.1.0
  description: API backend de l’agent autonome de veille d’opportunités.
servers:
  - url: http://127.0.0.1:8787
    description: Développement local
  - url: https://REPLACE_WITH_API_FUNCTION_URL
    description: Production (Lambda Function URL, header x-api-key requis)

tags:
  - name: Health
  - name: Profile
  - name: Opportunities
  - name: Runs
  - name: Watch

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Vérifier la disponibilité du backend
      operationId: getHealth
      responses:
        '200':
          description: Backend disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/watch:
    get:
      tags: [Watch]
      summary: État de veille de l'agent
      description: Dernier cycle, prochain cycle, quota du jour et URLs analysées.
      operationId: getWatchState
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: État de veille
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchState'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/profile:
    get:
      tags: [Profile]
      summary: Lire le profil courant
      operationId: getProfile
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profile]
      summary: Remplacer le profil courant
      operationId: updateProfile
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/opportunities:
    get:
      tags: [Opportunities]
      summary: Lister les opportunités
      operationId: listOpportunities
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [new, seen, saved, dismissed, expired]
        - name: min_score
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: since
          in: query
          description: ISO 8601 — opportunités vérifiées après cette date (polling nouveautés)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/opportunities/{opportunity_id}:
    get:
      tags: [Opportunities]
      summary: Lire une opportunité
      operationId: getOpportunity
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OpportunityId'
      responses:
        '200':
          description: Opportunité trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/opportunities/{opportunity_id}/feedback:
    post:
      tags: [Opportunities]
      summary: Enregistrer le feedback utilisateur
      operationId: submitOpportunityFeedback
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OpportunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Feedback enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs:
    post:
      tags: [Runs]
      summary: Déclencher un cycle de veille
      description: Réservé au développement et à l’administration dans le MVP initial.
      operationId: createWatchRun
      security:
        - ApiKeyAuth: []
      responses:
        '202':
          description: Cycle accepté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/runs/{run_id}:
    get:
      tags: [Runs]
      summary: Consulter le statut d’un cycle
      operationId: getWatchRun
      security:
        - ApiKeyAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cycle trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Clé partagée exigée par l'API publique (Lambda Function URL).
        Inactive en local tant que API_KEY est vide. 401 si absente ou invalide.

  parameters:
    OpportunityId:
      name: opportunity_id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Clé API manquante ou invalide (API publique uniquement)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Cycle ignoré par un garde-fou (fréquence, quota, cycle actif)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Trop de cycles demandés
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Données invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: recal-api
        version:
          type: string
          example: 0.1.0

    UserProfile:
      type: object
      required: [id, interests, countries, study_level, skills, relevance_threshold]
      properties:
        id:
          type: string
        full_name:
          type: string
          maxLength: 120
        language:
          type: string
          enum: [fr, en]
          default: fr
        interests:
          type: array
          items: {type: string}
        countries:
          type: array
          items: {type: string}
        mobility_countries:
          type: array
          items: {type: string}
          description: Pays acceptés pour les opportunités en présentiel
        study_level:
          type: string
        skills:
          type: array
          items: {type: string}
        relevance_threshold:
          type: number
          minimum: 0
          maximum: 100
        watch:
          $ref: '#/components/schemas/WatchSettings'

    UserProfileUpdate:
      type: object
      required: [interests, countries, study_level, skills, relevance_threshold]
      properties:
        full_name:
          type: string
          maxLength: 120
        language:
          type: string
          enum: [fr, en]
          default: fr
        interests:
          type: array
          items: {type: string}
        countries:
          type: array
          items: {type: string}
        mobility_countries:
          type: array
          items: {type: string}
        study_level:
          type: string
        skills:
          type: array
          items: {type: string}
        relevance_threshold:
          type: number
          minimum: 0
          maximum: 100
        watch:
          $ref: '#/components/schemas/WatchSettings'

    WatchSettings:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        frequency_minutes:
          type: integer
          minimum: 15
          maximum: 10080
          default: 60
        allowed_domains:
          type: array
          items: {type: string}
          description: Vide = catalogue par défaut de l'agent
        opportunity_types:
          type: array
          items:
            type: string
            enum: [hackathon, internship, fellowship, scholarship, conference, certification]
        max_queries_per_run:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        max_results_per_query:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        minimum_relevance_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Surcharge le seuil du profil si défini
        daily_max_runs:
          type: integer
          minimum: 1
          maximum: 96
          default: 12

    WatchState:
      type: object
      properties:
        last_run_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true
        last_successful_run_at:
          type: string
          format: date-time
          nullable: true
        runs_today:
          type: integer
        daily_max_runs:
          type: integer
        processed_urls_count:
          type: integer
        enabled:
          type: boolean
        frequency_minutes:
          type: integer

    Opportunity:
      type: object
      required: [id, type, title, summary, relevance_score, confidence_score, source_url, status]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [hackathon, internship, fellowship, scholarship, conference, certification, other]
        title: {type: string}
        organization: {type: string}
        summary: {type: string}
        relevance_score:
          type: number
          minimum: 0
          maximum: 100
        confidence_score:
          type: number
          minimum: 0
          maximum: 100
        relevance_reasons:
          type: array
          items: {type: string}
        deadline:
          type: string
          format: date
          nullable: true
        eligibility:
          type: object
          additionalProperties: true
        source_url:
          type: string
          format: uri
        verified_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [new, seen, saved, dismissed, expired]

    OpportunityPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Opportunity'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    FeedbackRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [interested, not_interested, saved, dismissed]
        comment:
          type: string
          nullable: true

    FeedbackResponse:
      type: object
      required: [opportunity_id, action, recorded_at]
      properties:
        opportunity_id: {type: string}
        action: {type: string}
        recorded_at:
          type: string
          format: date-time

    Run:
      type: object
      required: [id, trigger, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [manual, scheduled]
          default: manual
        status:
          type: string
          enum: [queued, running, completed, failed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        opportunities_found:
          type: integer
          minimum: 0
        error_message:
          type: string
          nullable: true
        urls_processed:
          type: array
          items: {type: string}

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details:
          type: object
          additionalProperties: true
